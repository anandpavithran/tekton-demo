apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository URL

    - name: revision
      type: string
      default: main
      description: Branch, tag, or commit

  workspaces:
    - name: output

  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/bin/sh
        set -e

        echo "Cloning repository..."
        git clone $(params.repo-url) /workspace/output/source

        cd /workspace/output/source
        git checkout $(params.revision)

        echo "Clone completed"

        ls -la
