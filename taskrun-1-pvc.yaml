apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: my-task-test-run-
spec:
  taskRef:
    name: print-message1
  params:
    - name: message
      value: "Using TASKRUN"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

